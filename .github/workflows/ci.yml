name: Telco CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only workflow: no repository secrets, no write access needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.9"
  # Same scope as the local TP04 checks (package, scripts, tests).
  LINT_TARGETS: "src/telco_churn tests scripts"

jobs:
  quality:
    name: Ruff and TP04 tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba4600eec # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --locked ruff check ${{ env.LINT_TARGETS }}

      - name: Ruff format (check only)
        run: uv run --locked ruff format --check ${{ env.LINT_TARGETS }}

      - name: Tests
        run: uv run --locked pytest -q --cov=telco_churn --cov-report=term-missing

  dependency-audit:
    name: pip-audit (locked environment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba4600eec # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      # Audits the installed distributions (including dev tools), not the lockfile.
      - name: Audit installed dependencies
        run: uv run --locked pip-audit

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Gitleaks 8.30.1 (checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 published with the v8.30.1 release assets
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf gitleaks.tar.gz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks/gitleaks"
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"
          gitleaks version

      # Scan exactly the tracked files: the archive excludes .git objects and any
      # generated/ignored files, so a finding always points at committed content.
      - name: Materialise the tracked files
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scan"
          git archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/scan"

      - name: Scan for committed secrets
        run: gitleaks dir --redact --exit-code 1 --no-banner "${RUNNER_TEMP}/scan"
