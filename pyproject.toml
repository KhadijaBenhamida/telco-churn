[project]
name = "telco-churn"
version = "0.1.0"
description = "Telco customer churn prediction project for MLOps coursework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
telco-churn = "telco_churn:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
